<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>載具序號查詢工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ddd6;
    --border-strong: #c8c4ba;
    --text: #1a1917;
    --text-muted: #6b6860;
    --text-faint: #9e9b94;
    --accent: #2d5a3d;
    --accent-light: #e8f0ea;
    --danger: #8b2020;
    --danger-light: #fdf0f0;
    --mono: 'Courier New', monospace;
    --sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }

  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 1.25rem;
  }

  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  header p {
    font-size: 0.8rem;
    color: var(--text-faint);
    margin-top: 0.25rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }

  .card-title {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 0.75rem;
  }

  /* Excel upload zone */
  .upload-zone {
    border: 1.5px dashed var(--border-strong);
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-zone .upload-icon {
    font-size: 1.5rem;
    margin-bottom: 0.4rem;
    color: var(--text-faint);
  }

  .upload-zone .upload-text {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .upload-zone .upload-sub {
    font-size: 0.75rem;
    color: var(--text-faint);
    margin-top: 0.2rem;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    font-size: 0.8rem;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-ok { background: var(--accent); }
  .dot-warn { background: #c47a00; }
  .dot-idle { background: var(--border-strong); }

  /* Query section */
  textarea {
    width: 100%;
    min-height: 88px;
    padding: 0.65rem 0.85rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.6;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-faint); }

  .controls {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  select {
    padding: 0.5rem 0.75rem;
    font-size: 0.82rem;
    font-family: var(--sans);
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    cursor: pointer;
    min-width: 150px;
    transition: border-color 0.15s;
  }

  select:focus { border-color: var(--accent); }

  button {
    padding: 0.5rem 1.25rem;
    font-size: 0.82rem;
    font-family: var(--sans);
    font-weight: 500;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.02em;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Results */
  .result-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
    line-height: 1.7;
  }

  .result-meta b { color: var(--text); font-weight: 600; }

  .result-section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 1rem 0 0.4rem;
  }

  .result-section-label:first-child { margin-top: 0; }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  th {
    text-align: left;
    padding: 0.5rem 0.75rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 0.55rem 0.75rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }

  td.mono { font-family: var(--mono); font-size: 0.75rem; }
  td.missing { color: var(--danger); font-family: var(--mono); font-size: 0.75rem; }

  .badge {
    display: inline-block;
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .badge-ok {
    background: var(--accent-light);
    color: var(--accent);
  }

  .badge-missing {
    background: var(--danger-light);
    color: var(--danger);
  }

  .hint {
    font-size: 0.73rem;
    color: var(--text-faint);
    margin-top: 0.35rem;
  }

  #result-area { margin-top: 0; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>載具序號查詢工具</h1>
    <p>上傳最新的載具序號對照表 Excel，貼上尚未使用的序號，即可查詢放置地點</p>
  </header>

  <!-- Step 1: Upload -->
  <div class="card">
    <div class="card-title">步驟 1 — 載入對照表</div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" accept=".xlsx,.xls" />
      <div class="upload-icon">📂</div>
      <div class="upload-text">點擊選擇 Excel 檔案，或拖曳至此</div>
      <div class="upload-sub">支援 .xlsx / .xls</div>
    </div>
    <div class="status-bar" id="status-bar">
      <span class="dot dot-idle" id="status-dot"></span>
      <span id="status-text" style="color:var(--text-faint)">尚未載入檔案</span>
    </div>
  </div>

  <!-- Step 2: Query -->
  <div class="card">
    <div class="card-title">步驟 2 — 查詢序號</div>
    <textarea id="input" placeholder="貼上尚未使用的載具序號，一行一個，例如：&#10;NXA8ZTA002217129C67600&#10;J7FQKGQ2DP&#10;XXGYYVYJW5" disabled></textarea>
    <p class="hint">支援一次貼多筆，每行一個序號</p>
    <div class="controls">
      <select id="loc-filter" disabled>
        <option value="">全部地點</option>
      </select>
      <button id="query-btn" onclick="lookup()" disabled>查詢</button>
    </div>
  </div>

  <!-- Results -->
  <div class="card" id="result-card" style="display:none">
    <div class="card-title">查詢結果</div>
    <div id="result-area"></div>
  </div>

</div>

<script>
let DATA = [];
let MAP = {};

const fileInput = document.getElementById('file-input');
const uploadZone = document.getElementById('upload-zone');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) processFile(fileInput.files[0]);
});

function processFile(file) {
  statusDot.className = 'dot dot-warn';
  statusText.style.color = '#c47a00';
  statusText.textContent = '讀取中…';

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      DATA = [];
      MAP = {};

      let headerRow = -1;
      for (let i = 0; i < Math.min(5, rows.length); i++) {
        const row = rows[i].map(c => String(c).trim());
        if (row.some(c => c.includes('序號') || c.includes('SerialNumber'))) {
          headerRow = i;
          break;
        }
      }

      const dataRows = headerRow >= 0 ? rows.slice(headerRow + 1) : rows.slice(1);

      dataRows.forEach(row => {
        const sn = String(row[0] || '').trim();
        const code = String(row[1] || '').trim();
        const loc = String(row[2] || '').trim();
        if (sn && sn !== 'undefined') {
          const rec = { 序號: sn, 編碼: code, 位置: loc };
          DATA.push(rec);
          MAP[sn.toUpperCase()] = rec;
        }
      });

      if (DATA.length === 0) throw new Error('no data');

      const locs = [...new Set(DATA.map(r => r['位置']).filter(v => v))].sort();
      const sel = document.getElementById('loc-filter');
      sel.innerHTML = '<option value="">全部地點</option>';
      locs.forEach(l => {
        const o = document.createElement('option');
        o.value = l; o.textContent = l;
        sel.appendChild(o);
      });

      document.getElementById('input').disabled = false;
      sel.disabled = false;
      document.getElementById('query-btn').disabled = false;
      document.getElementById('result-card').style.display = 'none';

      statusDot.className = 'dot dot-ok';
      statusText.style.color = 'var(--accent)';
      statusText.textContent = `已載入「${file.name}」— 共 ${DATA.length} 筆資料`;

    } catch(err) {
      statusDot.className = 'dot dot-warn';
      statusText.style.color = 'var(--danger)';
      statusText.textContent = '讀取失敗，請確認是正確的載具對照表 Excel';
    }
  };
  reader.readAsArrayBuffer(file);
}

function lookup() {
  const raw = document.getElementById('input').value;
  const filterLoc = document.getElementById('loc-filter').value;
  const serials = raw.split(/[\n,;，；]+/).map(s => s.trim()).filter(Boolean);
  if (!serials.length) return;

  const found = [], notFound = [];
  serials.forEach(s => {
    const rec = MAP[s.toUpperCase()];
    if (rec) found.push({ s, rec });
    else notFound.push(s);
  });

  const filtered = filterLoc ? found.filter(({rec}) => rec['位置'] === filterLoc) : found;

  const locLabel = filterLoc ? `「${filterLoc}」` : '';
  let summary = `輸入 <b>${serials.length}</b> 筆`;
  if (filterLoc) {
    summary += ` ｜ 對照表中找到 <b>${found.length}</b> 筆 ｜ 在 <b>${locLabel}</b> 的有 <b>${filtered.length}</b> 筆`;
  } else {
    summary += ` ｜ 找到 <b>${found.length}</b> 筆`;
  }
  summary += ` ｜ 查無 <b>${notFound.length}</b> 筆`;

  let html = `<div class="result-meta">${summary}</div>`;

  if (filtered.length) {
    html += `<div class="result-section-label">查詢結果${filterLoc ? ' — ' + filterLoc : ''}</div>`;
    html += `<div class="table-wrap"><table><thead><tr>
      <th style="width:240px">載具序號</th>
      <th style="width:110px">載具編碼</th>
      <th>放置位置</th>
    </tr></thead><tbody>`;
    filtered.forEach(({s, rec}) => {
      html += `<tr>
        <td class="mono">${s}</td>
        <td>${rec['編碼'] || '—'}</td>
        <td>${rec['位置'] || '—'}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if (notFound.length) {
    html += `<div class="result-section-label" style="margin-top:1.25rem">對照表中查無（${notFound.length} 筆）</div>`;
    html += `<div class="table-wrap"><table><thead><tr>
      <th style="width:240px">載具序號</th>
      <th>狀態</th>
    </tr></thead><tbody>`;
    notFound.forEach(s => {
      html += `<tr>
        <td class="missing">${s}</td>
        <td><span class="badge badge-missing">查無</span></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if (filtered.length === 0 && notFound.length === 0) {
    html += `<p style="font-size:0.82rem;color:var(--text-faint);margin-top:0.5rem">沒有符合條件的結果</p>`;
  }

  document.getElementById('result-area').innerHTML = html;
  document.getElementById('result-card').style.display = 'block';
}
</script>
</body>
</html>
